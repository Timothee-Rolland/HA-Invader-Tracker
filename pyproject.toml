[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
# Pinned explicitly: ruff's default rule set changes between releases, and CI
# installs the latest version. Without a select list a new ruff release turns
# the build red without a single line of code changing.
select = [
    "ASYNC", # flake8-async
    "B",     # flake8-bugbear
    "BLE",   # flake8-blind-except
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "I",     # isort
    "RUF",   # ruff-specific rules
    "SIM",   # flake8-simplify
    "UP",    # pyupgrade
    "W",     # pycodestyle warnings
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
