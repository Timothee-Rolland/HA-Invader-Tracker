name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Linters are pinned on purpose: an unpinned ruff/mypy turns CI red on a new
  # release without a single line of code changing. Bump deliberately.
  RUFF_VERSION: "0.17.2"
  MYPY_VERSION: "2.4.0"

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install "ruff==${RUFF_VERSION}"

      - name: Check linting
        run: ruff check custom_components/invader_tracker tests/

      - name: Check formatting
        run: ruff format --check custom_components/invader_tracker tests/

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install "mypy==${MYPY_VERSION}"
          pip install homeassistant beautifulsoup4 aiohttp voluptuous

      - name: Run mypy
        run: mypy custom_components/invader_tracker

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install pytest pytest-asyncio pytest-cov
          pip install homeassistant beautifulsoup4 aiohttp voluptuous

      - name: Run tests
        run: pytest --cov=custom_components/invader_tracker --cov-report=term-missing
